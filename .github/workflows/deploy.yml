name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys overwrite each other mid-rsync.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # Fail in seconds with a readable message rather than part-way through a
      # build. An unset GitHub variable arrives as an empty string, not as unset.
      #
      # Non-secret settings are read from the Variables tab first and fall back
      # to the Secrets tab, so the deploy works whichever tab they were entered
      # on. Variables are preferable: GitHub masks secrets in logs, which turns
      # URLs into *** and makes failures harder to read.
      - name: Check required configuration
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || secrets.NEXT_PUBLIC_SITE_URL }}
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL }}
          HOST: ${{ secrets.CPANEL_HOST }}
          USER_NAME: ${{ secrets.CPANEL_USER }}
          KEY: ${{ secrets.CPANEL_SSH_KEY }}
          API_PATH: ${{ secrets.CPANEL_API_PATH }}
          WEB_PATH: ${{ secrets.CPANEL_WEB_PATH }}
          PY_ACTIVATE: ${{ secrets.CPANEL_PY_ACTIVATE }}
        run: |
          set -uo pipefail
          missing=()
          [ -n "${SITE_URL// }" ]    || missing+=("variable NEXT_PUBLIC_SITE_URL   e.g. https://yourdomain.com")
          [ -n "${API_URL// }" ]     || missing+=("variable NEXT_PUBLIC_API_URL    e.g. https://api.yourdomain.com")
          [ -n "${HOST// }" ]        || missing+=("secret   CPANEL_HOST            your server hostname")
          [ -n "${USER_NAME// }" ]   || missing+=("secret   CPANEL_USER            your cPanel username")
          [ -n "${KEY// }" ]         || missing+=("secret   CPANEL_SSH_KEY         the private deploy key")
          [ -n "${API_PATH// }" ]    || missing+=("secret   CPANEL_API_PATH        /home/USER/apps/api")
          [ -n "${WEB_PATH// }" ]    || missing+=("secret   CPANEL_WEB_PATH        /home/USER/apps/web")
          [ -n "${PY_ACTIVATE// }" ] || missing+=("secret   CPANEL_PY_ACTIVATE     path to the venv activate script")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::${#missing[@]} required setting(s) are missing. See DEPLOYMENT.md Step 5."
            printf '\nNot set:\n'
            printf '  %s\n' "${missing[@]}"
            printf '\nAdd them under GitHub > Settings > Secrets and variables > Actions.\n'
            printf 'Variables go on the Variables tab, secrets on the Secrets tab.\n'
            exit 1
          fi
          echo "All required secrets and variables are present."

      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The site is built here rather than on the server: shared cPanel accounts
      # are CPU- and memory-capped, and a Next.js build will often be killed
      # mid-flight. The runner ships a finished bundle instead.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the front end
        working-directory: frontend
        env:
          # NEXT_PUBLIC_* values are inlined at build time, so they must be
          # present here - setting them on the server afterwards has no effect.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL }}
          # Rewrite destinations are frozen into routes-manifest.json during the
          # build, so the /media proxy target has to be right here too.
          API_INTERNAL_URL: ${{ vars.API_INTERNAL_URL || secrets.API_INTERNAL_URL || vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT || secrets.NEXT_PUBLIC_ADSENSE_CLIENT }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID || secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_GSC_VERIFICATION: ${{ vars.NEXT_PUBLIC_GSC_VERIFICATION || secrets.NEXT_PUBLIC_GSC_VERIFICATION }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Assemble the deployable front end
        run: |
          set -euo pipefail
          rm -rf deploy/web && mkdir -p deploy/web
          # Standalone output: server.js plus only the node_modules it needs.
          cp -r frontend/.next/standalone/. deploy/web/
          mkdir -p deploy/web/.next
          cp -r frontend/.next/static deploy/web/.next/static
          cp -r frontend/public deploy/web/public
          # cPanel's default Node startup filename is app.js.
          cp frontend/passenger-app.js deploy/web/app.js
          mkdir -p deploy/web/tmp
          echo "Front-end bundle: $(du -sh deploy/web | cut -f1)"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_PORT: ${{ vars.CPANEL_SSH_PORT || secrets.CPANEL_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Strip CR so a key pasted from Windows or a wrapped terminal still
          # parses, and guarantee the trailing newline OpenSSH requires.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # A malformed key fails later as "error in libcrypto" followed by a
          # password prompt, which reads like a server-side permission problem
          # and is not. Diagnose it here instead. None of what is printed is
          # secret: the BEGIN/END markers are fixed strings and the counts
          # reveal nothing about the key material.
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::CPANEL_SSH_KEY is not a valid OpenSSH private key."
            lines=$(wc -l < ~/.ssh/deploy_key)
            first=$(head -1 ~/.ssh/deploy_key)
            last=$(tail -1 ~/.ssh/deploy_key)
            echo ""
            echo "What arrived in the secret:"
            echo "  lines      : $lines"
            echo "  first line : $first"
            echo "  last line  : $last"
            echo ""
            case "$first" in
              *"PUBLIC KEY"*|ssh-*)
                echo "  Diagnosis: this is the PUBLIC key."
                echo "  Fix: the secret needs the private half - the file with NO .pub extension."
                ;;
              *BEGIN*)
                if [ "$lines" -lt 3 ]; then
                  echo "  Diagnosis: the line breaks were lost - the whole key is on one line."
                  echo "  Fix: copy it as a file rather than selecting terminal text:"
                  echo "         pbcopy < ~/.ssh/cpanel_deploy     # macOS"
                  echo "         xclip -sel clip < ~/.ssh/cpanel_deploy   # Linux"
                  echo "       then paste into the secret and save."
                else
                  echo "  Diagnosis: begins correctly but will not parse."
                  echo "  Fix: check for leading spaces on each line, a missing END line,"
                  echo "       or a passphrase on the key (deploy keys must have none)."
                fi
                ;;
              *)
                echo "  Diagnosis: does not start with a BEGIN line - the secret looks empty or truncated."
                echo "  Fix: re-paste the entire file, including the BEGIN and END lines."
                ;;
            esac
            echo ""
            echo "Regenerate a passphrase-less key if in doubt:"
            echo "  ssh-keygen -t ed25519 -f ~/.ssh/cpanel_deploy -N \"\""
            exit 1
          fi
          echo "Private key parsed successfully."
          echo "  fingerprint: $(ssh-keygen -lf ~/.ssh/deploy_key 2>/dev/null)"

          # Pin the host key so the deploy fails loudly rather than trusting
          # whatever answers on first connect.
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::Could not reach $SSH_HOST on port $SSH_PORT to read its host key."
            echo "Check CPANEL_HOST and CPANEL_SSH_PORT (Namecheap uses 21098, Hostinger 65002)."
            exit 1
          fi
          echo "Host key collected for $SSH_HOST:$SSH_PORT."

      # Prove authentication works before rsync, so a rejected key is reported
      # here with its remedy instead of as an rsync exit code 255.
      - name: Verify SSH authentication
        env:
          SSH_PORT: ${{ vars.CPANEL_SSH_PORT || secrets.CPANEL_SSH_PORT || '22' }}
          SSH_TARGET: ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}
        run: |
          set -uo pipefail
          # BatchMode stops SSH falling back to an interactive password prompt,
          # which on a runner just produces three silent retries and a timeout.
          if ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
                 -o BatchMode=yes -o StrictHostKeyChecking=yes \
                 -o ConnectTimeout=20 "$SSH_TARGET" 'echo AUTH_OK'; then
            echo "SSH authentication succeeded."
            exit 0
          fi

          echo "::error::The server rejected this key. It parsed correctly, so the key itself is fine - the matching public key is not authorised for this account."
          echo ""
          echo "Authorise EXACTLY this public key on the server. It is derived from"
          echo "the private key in CPANEL_SSH_KEY, so it is guaranteed to match:"
          echo ""
          echo "-----------------------------------------------------------"
          ssh-keygen -y -f ~/.ssh/deploy_key
          echo "-----------------------------------------------------------"
          echo ""
          echo "Either paste it into cPanel > SSH Access > Manage SSH Keys > Import Key,"
          echo "then click Manage > Authorize. Or append it from a machine that can"
          echo "already log in:"
          echo ""
          echo "  echo 'PASTE_THE_KEY_ABOVE' >> ~/.ssh/authorized_keys"
          echo "  chmod 600 ~/.ssh/authorized_keys && chmod 700 ~/.ssh"
          echo ""
          echo "Then compare fingerprints - these two must match:"
          echo "  this key            : $(ssh-keygen -lf ~/.ssh/deploy_key 2>/dev/null)"
          echo "  server's authorised : ssh-keygen -lf ~/.ssh/authorized_keys   (run on the server)"
          echo ""
          echo "Also confirm CPANEL_USER is the cPanel account name."
          exit 1

      - name: Upload the front end
        env:
          SSH_PORT: ${{ vars.CPANEL_SSH_PORT || secrets.CPANEL_SSH_PORT || '22' }}
          TARGET: ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:${{ secrets.CPANEL_WEB_PATH }}/
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            --exclude '.env' \
            --exclude 'tmp/' \
            deploy/web/ "$TARGET"

      - name: Upload the backend
        env:
          SSH_PORT: ${{ vars.CPANEL_SSH_PORT || secrets.CPANEL_SSH_PORT || '22' }}
          TARGET: ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:${{ secrets.CPANEL_API_PATH }}/
        run: |
          set -euo pipefail
          # --delete keeps the server clean, but uploaded images, the server's
          # own .env and the cPanel-managed virtualenv must survive it.
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            --exclude '.env' \
            --exclude 'media/' \
            --exclude 'tmp/' \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '*.db' \
            --exclude '*.db-shm' \
            --exclude '*.db-wal' \
            backend/ "$TARGET"

      - name: Install dependencies and restart both apps
        env:
          SSH_PORT: ${{ vars.CPANEL_SSH_PORT || secrets.CPANEL_SSH_PORT || '22' }}
          SSH_TARGET: ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}
          API_PATH: ${{ secrets.CPANEL_API_PATH }}
          WEB_PATH: ${{ secrets.CPANEL_WEB_PATH }}
          PY_ACTIVATE: ${{ secrets.CPANEL_PY_ACTIVATE }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes "$SSH_TARGET" \
            API_PATH="$API_PATH" WEB_PATH="$WEB_PATH" PY_ACTIVATE="$PY_ACTIVATE" 'bash -s' <<'REMOTE'
          set -euo pipefail

          echo "==> Python dependencies"
          # shellcheck disable=SC1090
          source "$PY_ACTIVATE"
          cd "$API_PATH"
          pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt
          mkdir -p media tmp

          echo "==> Restarting the Python app"
          # Passenger reloads when this file's mtime changes.
          touch tmp/restart.txt

          echo "==> Restarting the Node app"
          mkdir -p "$WEB_PATH/tmp"
          touch "$WEB_PATH/tmp/restart.txt"

          echo "==> Done"
          REMOTE

      - name: Verify the deployment
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || secrets.NEXT_PUBLIC_SITE_URL }}
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          # Passenger starts workers lazily, so the first request may be slow.
          for attempt in 1 2 3 4 5 6; do
            api=$(curl -fsS --max-time 30 "$API_URL/health" 2>/dev/null || echo "")
            if [ -n "$api" ]; then
              echo "API healthy: $api"
              break
            fi
            echo "API not up yet (attempt $attempt), waiting..."
            sleep 10
            [ "$attempt" = "6" ] && { echo "::error::API did not come back up"; exit 1; }
          done

          site=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 30 "$SITE_URL/") || site=000
          echo "Site returned HTTP $site"
          [ "$site" = "200" ] || { echo "::error::Site did not return 200"; exit 1; }

          echo "Deployment verified."
